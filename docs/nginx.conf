# Finance app — installed by docs/install.sh to /etc/nginx/sites-available/finance
# (domain substituted, stock "default" site removed so this is the default vhost).
# Serves the React build from /var/www/finance and proxies /api/* to Fastify.

server {
    listen 443 ssl http2 default_server;
    server_name finance.example.com;

    # Installed with Ubuntu's "snakeoil" self-signed cert (ssl-cert package) so
    # HTTPS — and the app's Secure session cookie — work immediately.
    # Replace with a real cert:
    #   sudo apt-get install -y certbot python3-certbot-nginx
    #   sudo certbot --nginx -d finance.example.com   # rewrites the two lines below
    # — or point them at an existing wildcard cert.
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/finance;
    index index.html;

    # SPA client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA service worker: must revalidate every load so app updates roll out promptly.
    # (add_header in a location drops inherited headers — restate HSTS.)
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Vite content-hashed build assets are immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (reserved for /api/ws)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80 default_server;
    server_name finance.example.com;
    return 301 https://$host$request_uri;
}
